name: CI frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-y-build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar estilo
        run: npm run lint

      - name: Compilar
        run: npm run build
